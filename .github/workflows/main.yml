name: Build APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Extract ZIP
        run: |
          unzip "Hesabdari feshorde.zip" -d project
          rm "Hesabdari feshorde.zip"
          ls -la project/
      
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Build APK
        run: |
          cd project
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            find . -name "gradlew" -type f -exec chmod +x {} \;
            find . -name "gradlew" -type f -exec {} assembleDebug \;
          fi
      
      - name: Find APK
        run: |
          find project -name "*.apk" -type f
      
      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: hesabdari-apk
          path: |
            project/**/*.apk
            project/app/build/outputs/apk/debug/*.apk
