name: Build APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Extract ZIP
        run: |
          echo "=== Files before extract ==="
          ls -la
          
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" -type f | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "✅ Found ZIP: $ZIP_FILE"
            unzip -o "$ZIP_FILE" -d project
            rm -f "$ZIP_FILE"
          else
            echo "❌ No ZIP file found!"
            exit 1
          fi
          
          echo "=== Files after extract ==="
          ls -la project/
          echo "=== Looking for assets ==="
          find project/ -name "index.html" -type f
      
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Build APK
        run: |
          cd project
          GRADLEW_PATH=$(find . -name "gradlew" -type f | head -n 1)
          if [ -n "$GRADLEW_PATH" ]; then
            chmod +x "$GRADLEW_PATH"
            cd $(dirname "$GRADLEW_PATH")
            ./gradlew assembleDebug
          else
            echo "gradlew not found, installing Gradle..."
            cd /tmp
            wget https://services.gradle.org/distributions/gradle-8.0-bin.zip
            unzip gradle-8.0-bin.zip
            export PATH=$PATH:/tmp/gradle-8.0/bin
            echo "PATH=$PATH" >> $GITHUB_ENV
            cd /home/runner/work/Hesabdari/Hesabdari/project
            gradle assembleDebug
          fi
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hesabdari-offline-apk
          path: |
            **/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
