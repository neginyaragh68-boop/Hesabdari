name: Build APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Extract ZIP
        run: |
          echo "=== Extracting ZIP ==="
          unzip -o "*.zip" -d project
          rm -f *.zip
          
          echo "=== Contents of project/ ==="
          ls -la project/
          
          # پیدا کردن پوشه‌ای که settings.gradle یا build.gradle در آن است
          PROJECT_DIR=$(find project/ -name "settings.gradle" -o -name "build.gradle" | head -n 1 | xargs dirname)
          echo "✅ Project directory found: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
      
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          echo "=== Building from: $(pwd) ==="
          ls -la
          
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "gradlew not found, using system Gradle..."
            gradle assembleDebug
          fi
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hesabdari-offline-apk
          path: |
            **/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
