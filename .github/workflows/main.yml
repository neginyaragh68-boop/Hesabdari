name: Build APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          echo "=== Files before extract ==="
          ls -la

          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" -type f | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "✅ Found ZIP: $ZIP_FILE"
            unzip -o "$ZIP_FILE" -d project
            rm -f "$ZIP_FILE"
          else
            echo "❌ No ZIP file found!"
            exit 1
          fi

          echo "=== Files after extract ==="
          ls -la project/

          # پیدا کردن هوشمند پوشه‌ای که فایل settings.gradle یا build.gradle در آن است
          PROJECT_DIR=$(find project/ -name "settings.gradle" -o -name "build.gradle" | head -n 1 | xargs dirname)
          echo "✅ پوشه اصلی پروژه پیدا شد: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK
        run: |
          # رفتن به پوشه اصلی پروژه که در مرحله قبل پیدا شد
          cd "$PROJECT_DIR"
          echo "=== در حال بیلد در مسیر: $(pwd) ==="

          # بررسی وجود gradlew
          if [ -f "gradlew" ]; then
            echo "✅ استفاده از gradlew"
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "⚠️ فایل gradlew پیدا نشد، در حال استفاده از گریدل سیستم..."
            # اگر gradlew نبود، گریدل را دانلود و استفاده می‌کنیم
            cd /tmp
            wget -q https://services.gradle.org/distributions/gradle-8.0-bin.zip
            unzip -q gradle-8.0-bin.zip
            export PATH=$PATH:/tmp/gradle-8.0/bin
            cd "$PROJECT_DIR"
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hesabdari-offline-apk
          path: |
            **/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
