<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>نگین یراق | حسابداری خانگی</title>
<link rel="icon" type="image/png" sizes="64x64" href="icons/icon-64.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0c0b09">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="نگین یراق">
<style>
  :root{
    --bg:#050505;
    --bg-soft:#0c0b09;
    --card:#141210;
    --card-2:#1b1712;
    --line:#3a2f1c;
    --gold:#e8bf5a;
    --gold-bright:#f7d876;
    --gold-dim:#8a6d2f;
    --text:#f3ecdd;
    --muted:#a99d84;
    --green:#2fbf6a;
    --red:#e6484f;
    --radius:20px;
    --radius-sm:13px;
    --shadow:0 8px 24px rgba(0,0,0,.45);
    --text-scale:1;
    --number-scale:1;
    --icon-scale:1;
  }
  html.light{
    --bg:#f4efe2;
    --bg-soft:#ece5d2;
    --card:#fffdf6;
    --card-2:#f4ecd8;
    --line:#e2d3a4;
    --gold:#b3862c;
    --gold-bright:#8f6a1c;
    --gold-dim:#c9ad6c;
    --text:#241d0f;
    --muted:#75694c;
    --shadow:0 8px 20px rgba(120,95,30,.15);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0;}
  body,input,button{font-family:'Vazirmatn','Segoe UI',Tahoma,Arial,sans-serif;}
  html,body{background:var(--bg-soft); color:var(--text);}
  #shell{
    max-width:430px; margin:0 auto; min-height:100vh;
    background:
      radial-gradient(120% 60% at 50% 0%, rgba(232,191,90,.10), transparent 60%),
      var(--bg);
    position:relative; display:flex; flex-direction:column;
  }
  #topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 18px 10px; position:sticky; top:0; z-index:5;
    background:var(--bg);
  }
  .icon-btn{
    width:40px;height:40px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:var(--card); border:1px solid var(--line); color:var(--gold);
    cursor:pointer; flex-shrink:0;
  }
  .icon-btn svg{width:19px;height:19px;}
  .icon-btn:active{transform:scale(.94);}
  #title{font-size:calc(25.5px * var(--text-scale, 1)); font-weight:700; color:var(--text); display:flex; align-items:center; gap:8px;}
  #content{flex:1; padding:4px 18px 24px; overflow-y:auto;}
  #bottomnav{
    position:sticky; bottom:0; left:0; right:0;
    display:flex; background:var(--card);
    border-top:1px solid var(--line);
    padding:8px 6px calc(8px + env(safe-area-inset-bottom));
    z-index:6;
  }
  .nav-btn{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;
    background:none; border:none; color:var(--muted); font-size:calc(16.5px * var(--text-scale, 1)); padding:6px 0;
    cursor:pointer; font-family:inherit;
  }
  .nav-btn svg{width:20px;height:20px;}
  .nav-btn.active{color:var(--gold-bright);}

  .brand-header{display:flex;flex-direction:column;align-items:center;text-align:center;padding:2px 0 8px;}
  .brand-header img{width:56px;height:56px;object-fit:contain;filter:drop-shadow(0 4px 14px rgba(232,191,90,.35));}
  .brand-header .name{font-weight:800; font-size:calc(28.5px * var(--text-scale, 1)); letter-spacing:.5px; color:var(--gold-bright); margin-top:2px;}
  .brand-header .sub{font-size:calc(18px * var(--text-scale, 1)); color:var(--muted); margin-top:0;}

  .card{
    background:linear-gradient(180deg, var(--card-2), var(--card));
    border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow);
  }
  .treasury-card{padding:18px 20px; margin-bottom:14px; text-align:center;}
  .treasury-card .label{display:flex; align-items:center; justify-content:center; gap:7px; color:var(--gold); font-size:calc(22.5px * var(--text-scale, 1)); font-weight:700;}
  .treasury-card .label svg{width:17px;height:17px; flex-shrink:0;}
  .treasury-card .amount{font-size:calc(45px * var(--number-scale, 1)); font-weight:800; margin:8px 0 2px; color:var(--text);}
  .treasury-card .unit{font-size:calc(21px * var(--text-scale, 1)); color:var(--gold-dim); font-weight:600;}
  .quick-row{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:14px;}
  .quick-btn{
    background:var(--card); border:1px solid var(--line); color:var(--gold-bright);
    border-radius:12px; padding:10px 2px; font-size:calc(15px * var(--text-scale, 1)); font-weight:800; cursor:pointer;
    display:flex; align-items:center; justify-content:center; text-align:center; line-height:1.35;
  }
  .quick-btn:active{background:var(--card-2); transform:scale(.96);}
  .quick-confirm{padding:16px; margin-bottom:14px;}
  .qc-top{display:flex; align-items:center; justify-content:space-between;}
  .qc-amount{font-size:calc(28.5px * var(--number-scale, 1)); font-weight:800; color:var(--gold-bright);}
  .qc-amount span{font-size:calc(16.5px * var(--text-scale, 1)); color:var(--muted); font-weight:500; margin-right:4px;}
  .qc-close{color:var(--muted); cursor:pointer; padding:2px;}
  .qc-close svg{width:15px;height:15px;}
  .qc-note{font-size:calc(17.25px * var(--text-scale, 1)); color:var(--muted); margin-top:4px;}
  .qc-btns{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px;}
  .qc-btn{
    border-radius:12px; padding:11px 0; display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .qc-btn svg{width:17px;height:17px;}
  .qc-btn.plus{background:rgba(47,191,106,.16); color:var(--green); border:1px solid rgba(47,191,106,.4);}
  .qc-btn.minus{background:rgba(230,72,79,.16); color:var(--red); border:1px solid rgba(230,72,79,.4);}
  .qc-btn:active{transform:scale(.95);}

  .cat-row{
    display:flex; align-items:center; gap:12px; padding:13px 14px; margin-bottom:10px;
    cursor:pointer;
  }
  .cat-row .cat-icon{
    width:42px;height:42px;border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:var(--bg); border:1px solid var(--line); flex-shrink:0;
  }
  .cat-icon svg{width:calc(20px * var(--icon-scale, 1));height:calc(20px * var(--icon-scale, 1));}
  .cat-row .cat-info{flex:1; min-width:0;}
  .cat-row .cat-name{font-size:calc(21.75px * var(--text-scale, 1)); font-weight:600; color:var(--text);}
  .cat-row .cat-amount{font-size:calc(19.5px * var(--number-scale, 1)); color:var(--muted); margin-top:2px;}
  .cat-row .chev{color:var(--gold-dim); flex-shrink:0;}
  .cat-row .chev svg{width:16px;height:16px;}

  .cat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:16px 10px; margin-bottom:14px;}
  .cat-grid-item{display:flex; flex-direction:column; align-items:center; gap:7px; cursor:pointer;}
  .cat-grid-item .cgi-circle{
    width:56px;height:56px;border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:var(--card); border:1px solid var(--line); box-shadow:var(--shadow); flex-shrink:0;
  }
  .cgi-circle svg{width:calc(24px * var(--icon-scale, 1));height:calc(24px * var(--icon-scale, 1));}
  .cat-grid-item .cgi-name{font-size:calc(13.5px * var(--text-scale, 1)); text-align:center; color:var(--text); font-weight:600; line-height:1.3;}
  .cat-grid-item:active .cgi-circle{transform:scale(.93);}

  #totalbar{
    display:none; align-items:center; justify-content:space-between; gap:10px;
    padding:12px 18px calc(10px + env(safe-area-inset-bottom));
    background:var(--card); border-top:1px solid var(--line); flex-shrink:0;
  }
  .circle-btn-pair{display:flex; align-items:center; gap:10px;}
  .add-cat-btn{display:flex; align-items:center; gap:10px; cursor:pointer;}
  .add-cat-btn .plus-circle{
    width:42px;height:42px;border-radius:50%; background:linear-gradient(160deg,var(--gold-bright),var(--gold-dim));
    display:flex;align-items:center;justify-content:center; color:#241a06; flex-shrink:0; box-shadow:var(--shadow);
  }
  .add-cat-btn .plus-circle svg{width:18px;height:18px;}
  .add-cat-btn .plus-label{
    background:var(--card); border:1px solid var(--line); color:var(--gold-bright);
    padding:9px 16px; border-radius:999px; font-size:calc(19.5px * var(--text-scale, 1)); font-weight:600;
  }
  .total-box{text-align:left;}
  .total-box .t-label{font-size:calc(16.5px * var(--text-scale, 1)); color:var(--muted);}
  .total-box .t-amount{font-size:calc(22.5px * var(--number-scale, 1)); font-weight:800; color:var(--gold-bright);}

  .section-label{font-size:calc(18px * var(--text-scale, 1)); color:var(--muted); margin:14px 2px 8px; font-weight:600;}

  .balance-card{padding:20px; text-align:center; margin-bottom:16px;}
  .balance-card .row{display:flex; align-items:center; justify-content:center; gap:6px; color:var(--muted); font-size:calc(19.5px * var(--text-scale, 1));}
  .balance-card .row svg{width:14px;height:14px; flex-shrink:0;}
  .balance-card .amt{font-size:calc(40.5px * var(--number-scale, 1)); font-weight:800; margin:8px 0 0;}

  .tx-row{display:flex; align-items:center; gap:12px; padding:12px 4px; border-bottom:1px solid var(--line);}
  .tx-row:last-child{border-bottom:none;}
  .tx-icon{width:34px;height:34px;border-radius:50%; display:flex;align-items:center;justify-content:center; flex-shrink:0;}
  .tx-icon.add{background:rgba(47,191,106,.14); color:var(--green);}
  .tx-icon.sub{background:rgba(230,72,79,.14); color:var(--red);}
  .tx-icon svg{width:16px;height:16px;}
  .tx-mid{flex:1; min-width:0;}
  .tx-type{font-size:calc(20.25px * var(--text-scale, 1)); font-weight:700;}
  .tx-type.add{color:var(--green);}
  .tx-type.sub{color:var(--red);}
  .tx-note{font-size:calc(16.5px * var(--text-scale, 1)); color:var(--muted); margin-top:1px;}
  .tx-right{text-align:left;}
  .tx-amount{font-size:calc(20.25px * var(--number-scale, 1)); font-weight:700;}
  .tx-date{font-size:calc(16.5px * var(--text-scale, 1)); color:var(--muted); margin-top:2px;}

  .gold-btn{
    width:100%; padding:14px; border-radius:14px; border:none;
    background:linear-gradient(160deg,var(--gold-bright),var(--gold-dim));
    color:#241a06; font-weight:800; font-size:calc(21.75px * var(--text-scale, 1)); cursor:pointer; margin-top:14px;
    display:flex; align-items:center; justify-content:center; gap:8px;
    font-family:inherit;
  }
  .gold-btn:active{transform:scale(.98);}
  .gold-btn svg{width:17px;height:17px;}
  .empty-note{text-align:center; color:var(--muted); font-size:calc(19.5px * var(--text-scale, 1)); padding:22px 6px;}

  /* Numpad */
  .amount-display{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px 18px; display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;
  }
  .amount-display .val{font-size:calc(30px * var(--number-scale, 1)); font-weight:800; letter-spacing:.5px;}
  .amount-display .unit{font-size:calc(15px * var(--text-scale, 1)); color:var(--muted); margin-right:6px;}
  .amount-display .clear-x{color:var(--muted); cursor:pointer; padding:4px;}
  .keypad{display:grid; grid-template-columns:repeat(3,1fr); gap:7px;}
  .key{
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:11px 0; font-size:calc(20px * var(--text-scale, 1)); font-weight:700; color:var(--text); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .key:active{background:var(--card-2); transform:scale(.96);}
  .key.fn{color:var(--gold-bright); font-size:calc(16px * var(--text-scale, 1));}
  .action-row{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px;}
  .action-btn{
    padding:14px 6px; border-radius:14px; border:none; cursor:pointer; font-family:inherit;
    font-size:calc(18.75px * var(--text-scale, 1)); font-weight:700; line-height:1.5;
  }
  .action-btn.pos{background:rgba(47,191,106,.16); color:var(--green); border:1px solid rgba(47,191,106,.4);}
  .action-btn.neg{background:rgba(230,72,79,.16); color:var(--red); border:1px solid rgba(230,72,79,.4);}
  .action-btn span{display:block; font-size:calc(15.75px * var(--text-scale, 1)); font-weight:500; opacity:.8; margin-top:2px;}

  /* Language / settings list */
  .list-item{
    display:flex; align-items:center; gap:12px; padding:14px 14px; margin-bottom:10px;
    cursor:pointer;
  }
  .list-item .flag{width:30px;height:30px;border-radius:50%; overflow:hidden; display:flex; align-items:center; justify-content:center; font-size:calc(24px * var(--text-scale, 1)); background:var(--bg); flex-shrink:0; border:1px solid var(--line);}
  .list-item .li-info{flex:1;}
  .list-item .li-name{font-size:calc(21px * var(--text-scale, 1)); font-weight:700;}
  .list-item .li-sub{font-size:calc(17.25px * var(--text-scale, 1)); color:var(--muted);}
  .check{color:var(--gold-bright);}
  .check svg{width:18px;height:18px;}

  .settings-row{
    display:flex; align-items:center; gap:12px; padding:14px; margin-bottom:10px; cursor:pointer;
  }
  .settings-row .s-icon{
    width:36px;height:36px;border-radius:50%; background:var(--bg); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; color:var(--gold-bright); flex-shrink:0;
  }
  .settings-row .s-icon svg{width:17px;height:17px;}
  .settings-row .s-text{flex:1;}
  .settings-row .s-title{font-size:calc(21px * var(--text-scale, 1)); font-weight:700;}
  .settings-row .s-sub{font-size:calc(16.5px * var(--text-scale, 1)); color:var(--muted); margin-top:1px;}
  .toggle{width:44px;height:25px;border-radius:20px; background:var(--bg); border:1px solid var(--line); position:relative; cursor:pointer; flex-shrink:0;}
  .toggle .knob{position:absolute; top:2px; right:2px; width:19px;height:19px;border-radius:50%; background:var(--muted); transition:.2s;}
  .toggle.on{background:rgba(232,191,90,.22); border-color:var(--gold-dim);}
  .toggle.on .knob{right:calc(100% - 21px); background:var(--gold-bright);}

  .slider-block{padding:18px; margin-bottom:14px;}
  .slider-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;}
  .slider-top .sl-title{font-size:16.5px; font-weight:700; color:var(--text);}
  .slider-top .sl-value{font-size:15px; font-weight:800; color:var(--gold-bright); background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:3px 10px; min-width:34px; text-align:center;}
  input[type=range].circle-slider{
    -webkit-appearance:none; appearance:none; width:100%; height:6px; border-radius:999px;
    background:var(--line); outline:none; margin:14px 0 2px; direction:ltr;
  }
  input[type=range].circle-slider::-webkit-slider-thumb{
    -webkit-appearance:none; width:26px; height:26px; border-radius:50%;
    background:linear-gradient(160deg,var(--gold-bright),var(--gold-dim));
    box-shadow:var(--shadow); cursor:pointer; border:3px solid var(--bg);
  }
  input[type=range].circle-slider::-moz-range-thumb{
    width:26px;height:26px;border-radius:50%;
    background:linear-gradient(160deg,var(--gold-bright),var(--gold-dim));
    border:3px solid var(--bg); cursor:pointer; box-shadow:var(--shadow);
  }
  .slider-sample{text-align:center; color:var(--muted); font-size:13.5px; margin-top:8px;}

  .about-box{text-align:center; padding:22px 10px 6px;}
  .about-box img{width:80px;height:80px;object-fit:contain; margin-bottom:8px;}
  .about-box .g-name{font-weight:800; color:var(--gold-bright); font-size:calc(22.5px * var(--text-scale, 1));}
  .about-box .g-desc{font-size:calc(18px * var(--text-scale, 1)); color:var(--muted); margin-top:4px; line-height:1.9;}
  .social-row{display:flex; justify-content:center; gap:10px; margin:16px 0 10px; flex-wrap:wrap;}
  .social-row a{
    width:38px;height:38px;border-radius:50%; background:var(--card); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; color:var(--gold); text-decoration:none;
  }
  .social-row a svg{width:16px;height:16px;}
  .phone-link{color:var(--gold-bright); font-weight:700; font-size:calc(19.5px * var(--text-scale, 1)); text-decoration:none; display:inline-flex; align-items:center; gap:6px; margin-top:4px;}
  .phone-link svg{width:14px;height:14px;}

  /* Add category */
  .icon-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin:16px 0;}
  .icon-pick{
    background:var(--card); border:2px solid var(--line); border-radius:16px; padding:16px 0;
    display:flex; flex-direction:column; align-items:center; gap:8px; cursor:pointer; color:var(--gold-bright);
  }
  .icon-pick svg{width:22px;height:22px;}
  .icon-pick span{font-size:calc(16.5px * var(--text-scale, 1)); color:var(--muted); font-weight:600;}
  .icon-pick.sel{border-color:var(--gold-bright); background:var(--card-2);}
  .text-input{
    width:100%; background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:15px; color:var(--text); font-size:calc(21px * var(--text-scale, 1)); font-family:inherit; margin-top:4px;
  }
  .text-input:focus{outline:none; border-color:var(--gold-dim);}
  .field-label{font-size:calc(18px * var(--text-scale, 1)); color:var(--muted); margin:14px 2px 6px;}
  .confirm-cancel-row{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px;}
  .sq-btn{
    aspect-ratio:1.6/1; border-radius:16px; display:flex; align-items:center; justify-content:center; gap:6px;
    font-weight:800; font-size:calc(16.5px * var(--text-scale, 1)); cursor:pointer; border:1px solid transparent;
  }
  .sq-btn svg{width:16px;height:16px;}
  .sq-btn.yes{background:rgba(47,191,106,.16); color:var(--green); border-color:rgba(47,191,106,.4);}
  .sq-btn.no{background:rgba(230,72,79,.16); color:var(--red); border-color:rgba(230,72,79,.4);}
  .sq-btn:active{transform:scale(.96);}

  /* Monthly */
  .month-row{display:flex; align-items:center; gap:12px; padding:14px; margin-bottom:10px; cursor:pointer;}
  .month-row .m-icon{width:38px;height:38px;border-radius:12px; background:var(--bg); border:1px solid var(--line); display:flex;align-items:center;justify-content:center; color:var(--gold-bright); flex-shrink:0;}
  .month-row .m-icon svg{width:17px;height:17px;}
  .month-row .m-info{flex:1;}
  .month-row .m-name{font-size:calc(21px * var(--text-scale, 1)); font-weight:700;}
  .month-row .m-amount{font-size:calc(18.75px * var(--number-scale, 1)); color:var(--muted); margin-top:2px;}
  .pill{padding:3px 9px; border-radius:999px; font-size:calc(16.5px * var(--text-scale, 1)); font-weight:700;}
  .pill.up{background:rgba(230,72,79,.16); color:var(--red);}
  .pill.down{background:rgba(47,191,106,.16); color:var(--green);}

  /* Reports */
  .tabs{display:flex; gap:8px; margin-bottom:16px;}
  .tab{flex:1; text-align:center; padding:11px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--muted); font-size:calc(19.5px * var(--text-scale, 1)); font-weight:700; cursor:pointer;}
  .tab.active{background:linear-gradient(160deg,var(--gold-bright),var(--gold-dim)); color:#241a06; border-color:transparent;}
  .donut-wrap{display:flex; justify-content:center; margin:6px 0 20px; position:relative;}
  .donut-center{position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); text-align:center;}
  .donut-center .dc-label{font-size:calc(16.5px * var(--text-scale, 1)); color:var(--muted);}
  .donut-center .dc-amt{font-size:calc(24px * var(--number-scale, 1)); font-weight:800; margin-top:2px;}
  .legend-row{display:flex; align-items:center; gap:10px; padding:10px 4px; border-bottom:1px solid var(--line);}
  .legend-row:last-child{border-bottom:none;}
  .dot{width:11px;height:11px;border-radius:50%; flex-shrink:0;}
  .legend-row .l-name{flex:1; font-size:calc(20.25px * var(--text-scale, 1)); font-weight:600;}
  .legend-row .l-amt{font-size:calc(19.5px * var(--number-scale, 1)); color:var(--muted);}
  .legend-row .l-pct{font-size:calc(18px * var(--text-scale, 1)); font-weight:800; color:var(--gold-bright); width:38px; text-align:left;}

  .toast{
    position:fixed; bottom:96px; left:50%; transform:translateX(-50%);

/* ========================= PERSIAN / JALALI HELPERS ========================= */
const FA_DIGITS = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
function faNum(n){ return String(n).replace(/[0-9]/g, d => FA_DIGITS[d]); }
function fmt(n){ n = Math.round(n||0); return n.toLocaleString('en-US'); }
function fmtFa(n){ return faNum(fmt(n)); }

function gregorianToJalali(gy, gm, gd) {
  const g_d_m = [0,31,59,90,120,151,181,212,243,273,304,334];
  let jy = (gy<=1600)?0:979;
  gy -= (gy<=1600)?621:1600;
  const gy2 = (gm>2)?(gy+1):gy;
  let days = (365*gy) + Math.floor((gy2+3)/4) - Math.floor((gy2+99)/100) + Math.floor((gy2+399)/400) - 80 + gd + g_d_m[gm-1];
  jy += 33*Math.floor(days/12053);
  days %= 12053;
  jy += 4*Math.floor(days/1461);
  days %= 1461;
  if (days > 365) { jy += Math.floor((days-1)/365); days = (days-1)%365; }
  const jm = (days < 186) ? 1 + Math.floor(days/31) : 7 + Math.floor((days-186)/30);
  const jd = 1 + ((days<186) ? (days%31) : ((days-186)%30));
  return [jy, jm, jd];
}
const JMONTHS = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
function nowJalali(){
  const d = new Date();
  return gregorianToJalali(d.getFullYear(), d.getMonth()+1, d.getDate());
}
function jalaliDateStr(){
  const [jy,jm,jd] = nowJalali();
  return `${faNum(jy)}/${faNum(String(jm).padStart(2,'0'))}/${faNum(String(jd).padStart(2,'0'))}`;
}
function jalaliMonthKey(){
  const [jy,jm] = nowJalali();
  return `${jy}-${String(jm).padStart(2,'0')}`;
}
function monthLabel(key){
  const [jy,jm] = key.split('-').map(Number);
  return `${JMONTHS[jm-1]} ${faNum(jy)}`;
}

let longPressFired = false;

function startLongPress(id){
  longPressFired = false;
  clearTimeout(longPressTimer);
  longPressTimer = setTimeout(()=>{ longPressFired = true; confirmDeleteCategory(id); }, 3000);
}
function cancelLongPress(){ clearTimeout(longPressTimer); }
function handleCatClick(id){
  if(longPressFired){ longPressFired = false; return; }
  nav({screen:'numpad', target:{type:'category', id}});
}
function confirmDeleteCategory(id){
  const c = getCategory(id);

      <div class="sq-btn no" onclick="closeModal()">${icon('x')} خیر</div>

}
function deleteCategory(id){
  DATA.categories = DATA.categories.filter(c=>c.id!==id);

function pickQuick(amount){
  quickPending = (quickPending && quickPending.amount===amount) ? null : {amount};
  const slot = document.getElementById('quick-confirm-slot');
  if(slot) slot.innerHTML = quickPending ? quickConfirmHtml() : '';
}

function quickConfirmHtml(){
  return `
    <div class="card quick-confirm">
      <div class="qc-top">
        <div class="qc-amount">${fmt(quickPending.amount)} <span>${DATA.settings.currency}</span></div>
        <div class="qc-close" onclick="cancelQuick()">${icon('x')}</div>
      </div>
      <div class="qc-note">افزودن یا کاهش در «هزینه‌های عمومی»</div>
      <div class="qc-btns">
        <div class="qc-btn plus" onclick="commitQuick('add')">${icon('plus')}</div>
        <div class="qc-btn minus" onclick="commitQuick('sub')">${icon('minus')}</div>
      </div>
    </div>`;
}
function cancelQuick(){
  quickPending = null;
  const slot = document.getElementById('quick-confirm-slot');
  if(slot) slot.innerHTML = '';
}
function commitQuick(type){
  if(!quickPending) return;
  const amount = quickPending.amount;
  const c = getGeneralCategory();
  if(type==='add'){
    c.balance += amount;
    DATA.treasury -= amount;
  } else {
    c.balance = Math.max(0, c.balance - amount);
    DATA.treasury += amount;
  }
  c.tx.push({id:cryptoRandom(), type, amount, date:jalaliDateStr(), month:jalaliMonthKey()});
  quickPending = null;
  save();
  render();
  showToast(type==='add' ? 'به هزینه‌های عمومی افزوده شد' : 'از هزینه‌های عمومی کاهش یافت');

function renderNumpad(){
  const target = view.target;
  const isTreasury = target.type === 'treasury';
  document.getElementById('content').innerHTML = `
    <div class="amount-display">
      <div class="clear-x" onclick="numpadValue=''; renderNumpad();">${icon('x')}</div>
      <div>
        <span class="unit">${DATA.settings.currency}</span>
        <span class="val">${numpadValue ? fmt(parseInt(numpadValue)) : '0'}</span>
      </div>
    </div>
    <div class="keypad">
      ${[1,2,3,4,5,6,7,8,9].map(n=>`<div class="key" onclick="npPress('${n}')">${faNum(n)}</div>`).join('')}
      <div class="key fn" onclick="npBackspace()">⌫</div>
      <div class="key" onclick="npPress('0')">۰</div>
      <div class="key fn" onclick="npPress('000')">۰۰۰</div>
    </div>
    <div class="qc-note" style="text-align:center; margin-top:14px;">${isTreasury ? 'افزودن یا کاهش در صندوق' : 'افزودن یا کاهش در این بخش'}</div>
    <div class="qc-btns" style="margin-top:8px;">
      <div class="qc-btn plus" onclick="npCommit('add')">${icon('plus')}</div>
      <div class="qc-btn minus" onclick="npCommit('sub')">${icon('minus')}</div>
    </div>
  `;
}
function npPress(d){
  if(numpadValue==='0') numpadValue='';
  numpadValue += d;
  if(numpadValue.length>12) numpadValue = numpadValue.slice(0,12);
  renderNumpad();
}
function npBackspace(){ numpadValue = numpadValue.slice(0,-1); renderNumpad(); }
function npCommit(type){
  const amount = parseInt(numpadValue||'0');
  if(!amount){ showToast('مبلغ را وارد کنید'); return; }
  const target = view.target;
  if(target.type === 'treasury'){
    if(type==='add'){
      DATA.treasury += amount;
      DATA.incomeLog.unshift({id:cryptoRandom(), type:'add', amount, date:jalaliDateStr(), month:jalaliMonthKey(), note:'افزایش نقدی صندوق'});
    } else {
      DATA.treasury = Math.max(0, DATA.treasury - amount);
      DATA.incomeLog.unshift({id:cryptoRandom(), type:'sub', amount, date:jalaliDateStr(), month:jalaliMonthKey(), note:'برداشت از صندوق'});
    }
    save();
    numpadValue='';
    nav({screen:'home'});
    showToast(type==='add' ? 'به صندوق افزوده شد' : 'از صندوق کاهش یافت');
    return;
  }
  const c = getCategory(target.id);
  if(type==='add'){
    c.balance += amount;
    DATA.treasury -= amount;
  } else {
    c.balance = Math.max(0, c.balance - amount);
    DATA.treasury += amount;
  }
  c.tx.push({id:cryptoRandom(), type, amount, date:jalaliDateStr(), month:jalaliMonthKey()});
  save();
  numpadValue='';
  nav({screen:'category', id:c.id});
  showToast(type==='add' ? 'به بخش افزوده شد' : 'از بخش کاهش یافت');
}

        <div class="list-item card" style="margin-bottom:8px;" onclick="setCurrency('${o}')">
          <div class="li-info"><div class="li-name">${o}</div></div>
          ${DATA.settings.currency===o?`<div class="check">${icon('check')}</div>`:''}
        </div>
      `).join('')}
    </div>
  `);
}
function setCurrency(o){
  DATA.settings.currency = o;
  save();
  closeModal();
  renderSettings();
}
function openBackup(){
  openModal('پشتیبان‌گیری', `
    <p>می‌توانید از اطلاعات خود یک فایل پشتیبان تهیه کنید یا فایل قبلی را بازیابی کنید.</p>
    <button class="gold-btn" onclick="exportBackup()">${icon('cloud')} دریافت فایل پشتیبان</button>
    <label class="gold-btn" style="display:flex; margin-top:10px;">
      ${icon('cloud')} بازیابی از فایل
      <input type="file" accept="application/json" style="display:none" onchange="importBackup(event)">
    </label>
  `);
}
function exportBackup(){
  const blob = new Blob([JSON.stringify(DATA,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'neginyarag-backup.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('فایل پشتیبان دریافت شد');
}
function importBackup(ev){
  const file = ev.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try{
      const parsed = JSON.parse(e.target.result);
      if(!parsed.categories) throw new Error('invalid');
      DATA = parsed;
      save();
      applyTheme();
      closeModal();
      nav({screen:'settings'});
      showToast('اطلاعات با موفقیت بازیابی شد');
    }catch(err){
      showToast('فایل پشتیبان معتبر نیست');
    }
  };
  reader.readAsText(file);
}

function formatCardNumber(num){
  return num.replace(/(.{4})/g, '$1 ').trim();
}
function openCharity(){
  const card = DATA.settings.charityCard;
  openModal('خیریه', `
    <p>این اپ رایگان است و کمک‌های خیرخواهانه شما کاربر عزیز تماما صرف افراد نیازمند خواهد شد.</p>
    <div class="charity-box">
      <div class="charity-card-number">${card ? formatCardNumber(card) : 'شماره کارت هنوز ثبت نشده است'}</div>
      ${card ? `<div class="charity-copy" onclick="copyCharityCard()">${icon('copy')} کپی</div>` : ''}
    </div>
  `);
}
function copyCharityCard(){
  const card = DATA.settings.charityCard;
  if(!card) return;
  const done = () => showToast('شماره کارت کپی شد');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(card).then(done).catch(done);
  } else {
    const ta = document.createElement('textarea');
    ta.value = card; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); }catch(e){}
    document.body.removeChild(ta);
    done();
  }
}

function confirmReset(correctSum){

  }];

  closeModal();
  nav({screen:'home'});

}

/* ========================= RENDER: MONTHLY ========================= */
function allMonthKeys(){
  const set = new Set();
  set.add(jalaliMonthKey());
  DATA.categories.forEach(c=>c.tx.forEach(t=>set.add(t.month)));
  DATA.incomeLog.forEach(i=>set.add(i.month));
  return Array.from(set).sort().reverse();
}
function monthTotals(key){
  let added=0, subbed=0;
  DATA.categories.forEach(c=>c.tx.forEach(t=>{
    if(t.month===key){ if(t.type==='add') added+=t.amount; else subbed+=t.amount; }
  }));
  return {added, subbed, net:added-subbed};
}
function renderMonthly(){
  const keys = allMonthKeys();
  document.getElementById('content').innerHTML = `
    <div class="section-label">روند هزینه‌های ماهانه</div>
    ${keys.map(k=>{
      const t = monthTotals(k);
      const pct = t.added ? Math.round((t.subbed/t.added)*100) : 0;
      return `
      <div class="card month-row" onclick="nav({screen:'monthDetail', month:'${k}'})">
        <div class="m-icon">${icon('calendar')}</div>
        <div class="m-info">
          <div class="m-name">${monthLabel(k)}</div>
          <div class="m-amount">${fmt(t.added)} ${DATA.settings.currency}</div>
        </div>
        <div class="pill ${t.subbed>=t.added*0.5?'up':'down'}">${faNum(pct)}%</div>
      </div>`;
    }).join('')}
  `;
}
function renderMonthDetail(){
  const key = view.month;
  const entries = [];
  DATA.categories.forEach(c=>c.tx.forEach(t=>{
    if(t.month===key) entries.push({...t, catName:c.name, catColor:c.color, catIcon:c.icon});
  }));
  entries.sort((a,b)=> (a.id<b.id?1:-1));
  const t = monthTotals(key);
  document.getElementById('content').innerHTML = `
    <div class="card balance-card">
      <div class="row">${icon('calendar')} مجموع تراکنش‌های ${monthLabel(key)}</div>
      <div class="amt" style="color:var(--gold-bright)">${fmt(t.added)}</div>
      <div class="unit" style="color:var(--muted); font-size:calc(18px * var(--text-scale, 1)); margin-top:2px;">${DATA.settings.currency} افزوده‌شده</div>
    </div>
    <div class="section-label">جزئیات</div>
    <div class="card" style="padding:4px 14px;">
      ${entries.length ? entries.map(t=>`
        <div class="tx-row">
          <div class="tx-icon ${t.type}">${icon(t.type==='add'?'plus':'minus')}</div>
          <div class="tx-mid">
            <div class="tx-type ${t.type}">${t.catName}</div>
            <div class="tx-note">${t.type==='add'?'افزودن':'برداخت'}</div>
          </div>
          <div class="tx-right">
            <div class="tx-amount">${fmt(t.amount)}</div>
            <div class="tx-date">${t.date}</div>
          </div>
        </div>
      `).join('') : `<div class="empty-note">تراکنشی در این ماه ثبت نشده است</div>`}
    </div>
  `;
}

function setReportTab(tab){ reportTab = tab; renderReport(); }
function renderReportBody(){
  const body = document.getElementById('report-body');
  if(reportTab==='expenses'){
    const total = totalExpenses();
    const segs = DATA.categories.filter(c=>c.balance>0);
    body.innerHTML = `
      <div class="donut-wrap">
        ${buildDonut(segs.map(c=>({value:c.balance, color:c.color})))}
        <div class="donut-center">
          <div class="dc-label">جمع هزینه‌ها</div>
          <div class="dc-amt">${fmt(total)}</div>
        </div>
      </div>
      <div class="card" style="padding:4px 14px;">
        ${segs.length ? segs.map(c=>`
          <div class="legend-row">
            <div class="dot" style="background:${c.color}"></div>
            <div class="l-name">${c.name}</div>
            <div class="l-amt">${fmt(c.balance)}</div>
            <div class="l-pct">${faNum(total?Math.round(c.balance/total*100):0)}%</div>
          </div>
        `).join('') : `<div class="empty-note">هنوز هزینه‌ای ثبت نشده است</div>`}
      </div>
    `;
  } else {
    const total = DATA.incomeLog.reduce((s,i)=> s + (i.type==='sub' ? -i.amount : i.amount), 0);
    body.innerHTML = `
      <div class="card balance-card">
        <div class="row">${icon('wallet')} خالص صندوق</div>
        <div class="amt" style="color:var(--green)">${fmt(total)}</div>
      </div>
      <div class="section-label">تراکنش‌های صندوق</div>
      <div class="card" style="padding:4px 14px;">
        ${DATA.incomeLog.length ? DATA.incomeLog.map(i=>`
          <div class="tx-row">
            <div class="tx-icon ${i.type==='sub'?'sub':'add'}">${icon(i.type==='sub'?'minus':'plus')}</div>
            <div class="tx-mid">
              <div class="tx-type ${i.type==='sub'?'sub':'add'}">${i.note||'افزایش صندوق'}</div>
            </div>
            <div class="tx-right">
              <div class="tx-amount">${fmt(i.amount)}</div>
              <div class="tx-date">${i.date}</div>
            </div>
          </div>
        `).join('') : `<div class="empty-note">تراکنشی ثبت نشده است</div>`}
      </div>
    `;
  }
}
function buildDonut(segments){
  const size=180, stroke=26, r=(size-stroke)/2, c=2*Math.PI*r;
  const total = segments.reduce((s,x)=>s+x.value,0) || 1;
  let offset = 0;
  const circles = segments.map(seg=>{
    const frac = seg.value/total;
    const len = frac*c;
    const dash = `${len} ${c-len}`;
    const rot = (offset/total)*360 - 90;
    offset += seg.value;
    return `<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${seg.color}" stroke-width="${stroke}" stroke-dasharray="${dash}" transform="rotate(${rot} ${size/2} ${size/2})" stroke-linecap="butt"/>`;
  }).join('');
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--line)" stroke-width="${stroke}"/>
    ${circles}
  </svg>`;
}
